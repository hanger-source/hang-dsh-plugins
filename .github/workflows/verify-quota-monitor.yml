name: Verify DSH Quota Monitor

on:
  pull_request:
    paths:
      - 'plugins/quota-monitor/**'
      - '.github/workflows/verify-quota-monitor.yml'
      - '.github/workflows/release-quota-monitor.yml'
  push:
    branches:
      - main
    paths:
      - 'plugins/quota-monitor/**'
      - '.github/workflows/verify-quota-monitor.yml'
      - '.github/workflows/release-quota-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          node --check plugins/quota-monitor/index.js
          node --check plugins/quota-monitor/client.js

      - name: Check npm package contents
        working-directory: plugins/quota-monitor
        run: npm pack --dry-run
